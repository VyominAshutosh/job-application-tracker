spring.application.name=job-application-tracker

# ${NAME:default} means: use the environment variable NAME if it is set, otherwise the default.
# On your laptop nothing is set, so the defaults below are used.
# On Render, PORT is set by Render, and DB_URL / DB_USERNAME / DB_PASSWORD point at Neon.
server.port=${PORT:8080}

# ---- PostgreSQL ----
# Local setup, once:  createdb jobtracker      (or)  CREATE DATABASE jobtracker;
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobtracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# update = Hibernate creates or alters the tables from the entities at startup.
# Fine for a college project. A real deployment would use Flyway or Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
